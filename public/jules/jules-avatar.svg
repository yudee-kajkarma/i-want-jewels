<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Jules">
  <defs>
    <clipPath id="jules-round"><circle cx="100" cy="100" r="100"/></clipPath>
  </defs>
  <g clip-path="url(#jules-round)">
    <!-- soft pink backdrop -->
    <rect width="200" height="200" fill="#f8dde9"/>
    <!-- long hair, behind the face -->
    <path d="M58 168 C54 128 52 96 60 72 C68 48 84 36 100 36 C116 36 132 48 140 72 C148 96 146 128 142 168 Z" fill="#2a1c19"/>
    <!-- neck -->
    <path d="M88 118 H112 V156 Q100 162 88 156 Z" fill="#dfa982"/>
    <!-- black top with a round neckline -->
    <path d="M30 210 C34 176 54 158 82 152 Q100 166 118 152 C146 158 166 176 170 210 Z" fill="#17121a"/>
    <!-- face -->
    <ellipse cx="100" cy="92" rx="28" ry="33" fill="#e8b896"/>
    <!-- hair over the forehead, parted to the side -->
    <path d="M71 104 C68 70 82 52 100 52 C118 52 132 68 129 104 C126 84 118 70 106 66 C96 70 82 80 71 104 Z" fill="#2a1c19"/>
    <!-- closed, smiling eyes -->
    <path d="M84 93 Q89 97 94 93" fill="none" stroke="#3b2622" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M106 93 Q111 97 116 93" fill="none" stroke="#3b2622" stroke-width="2.2" stroke-linecap="round"/>
    <!-- blush -->
    <ellipse cx="83" cy="103" rx="5" ry="3" fill="#e98a95" opacity="0.35"/>
    <ellipse cx="117" cy="103" rx="5" ry="3" fill="#e98a95" opacity="0.35"/>
    <!-- smile -->
    <path d="M94 109 Q100 114 106 109" fill="none" stroke="#b25a57" stroke-width="2" stroke-linecap="round"/>
    <!-- gold necklace with a small pendant -->
    <path d="M78 156 Q100 174 122 156" fill="none" stroke="#d6a640" stroke-width="2.6" stroke-linecap="round"/>
    <circle cx="100" cy="168" r="3.6" fill="#fff6dc" stroke="#d6a640" stroke-width="1.6"/>
    <!-- a little sparkle earring -->
    <path d="M70 108 L71.6 112.4 L76 114 L71.6 115.6 L70 120 L68.4 115.6 L64 114 L68.4 112.4 Z" fill="#ffffff"/>
  </g>
</svg>
